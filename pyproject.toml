[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lara-skills"
version = "0.1.0"
description = "LARA: labor-market-aware relational attention for technology-to-skill recommendation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jihwan Sim", email = "sim2080@dongyang.ac.kr" }]
keywords = ["skill recommendation", "labor market", "job postings", "patents", "graph neural network", "heterogeneous graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "duckdb>=1.0",
    "torch>=2.2",
]

[project.optional-dependencies]
bge = ["sentence-transformers>=3.0"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "openpyxl>=3.1"]

[project.scripts]
lara-skills = "lara_skills.cli:main"

[project.urls]
Homepage = "https://github.com/SimGGG/lara-skills"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
